<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Network Diagnostics - qianjunakasumi.moe</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    body {
      margin: 0;
      padding: 24px;
      background: #f5f7fb;
      color: #111827;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    p {
      margin: 0 0 16px;
      line-height: 1.6;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 4px;
    }
    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 10px 16px;
      text-decoration: none;
      background: #0f766e;
      color: #fff;
      font-size: 14px;
    }
    label {
      font-size: 14px;
      color: #4b5563;
    }
    select {
      margin-left: 6px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #111827;
    }
    .results {
      display: grid;
      gap: 16px;
      margin-top: 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 18px;
      word-break: break-all;
    }
    .meta {
      display: grid;
      grid-template-columns: minmax(120px, auto) 1fr;
      gap: 6px 10px;
      font-size: 14px;
    }
    .key {
      color: #4b5563;
    }
    .status-ok {
      color: #047857;
      font-weight: 600;
    }
    .status-fail {
      color: #b91c1c;
      font-weight: 600;
    }
    details {
      margin-top: 10px;
    }
    pre {
      margin: 8px 0 0;
      padding: 10px;
      border-radius: 8px;
      background: #111827;
      color: #f9fafb;
      overflow: auto;
      font-size: 12px;
      line-height: 1.4;
      max-height: 260px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #e5e7eb;
      }
      .card {
        background: #111827;
        border-color: #1f2937;
      }
      .key {
        color: #9ca3af;
      }
      select {
        background: #111827;
        color: #e5e7eb;
        border-color: #374151;
      }
    }
  </style>
</head>
<body>
<main class="container">
  <h1 id="pageTitle"></h1>
  <p id="pageDescription"></p>
  <div class="toolbar">
    <button id="runButton" type="button"></button>
    <a id="statusLink" class="button-link" href="https://stats.uptimerobot.com/8VtkljQ4us" target="_blank" rel="noopener noreferrer"></a>
    <label for="languageSelect">
      <span id="languageText"></span>
      <select id="languageSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="zh-CN">简体中文</option>
      </select>
    </label>
  </div>
  <section id="results" class="results" aria-live="polite"></section>
</main>
<script>
  const i18n = {
    en: {
      title: "Network Diagnostics",
      description: "This page requests target domains directly from your browser and shows connection, HTTP, and CORS diagnostics.",
      run: "Run diagnostics",
      statusPage: "Open status page",
      language: "Language",
      requestUrl: "Request URL",
      finalUrl: "Final URL",
      status: "Status",
      duration: "Duration",
      responseType: "Response type",
      onlineState: "Browser online state",
      errorType: "Error type",
      errorMessage: "Error message",
      pending: "Diagnosing...",
      failed: "Request failed",
      readableHeaders: "Readable response headers",
      bodyPreview: "Response body preview (first 2000 chars)",
      errorDetail: "Error details",
      info: "Info",
      errorHint: "A browser fetch can fail due to CORS policy, DNS failures, certificate errors, or network filtering.",
      headerFallback: "(No readable headers, likely due to CORS restrictions)",
      empty: "(empty)",
      unavailable: "(unavailable)",
      bodyReadFail: "Failed to read response body"
    },
    "zh-CN": {
      title: "网络诊断页面",
      description: "此页面会直接在你的浏览器请求目标域名，并显示连接、HTTP 与 CORS 相关结果，便于排查访问异常。",
      run: "开始诊断",
      statusPage: "前往状态页",
      language: "语言",
      requestUrl: "请求地址",
      finalUrl: "最终地址",
      status: "状态",
      duration: "耗时",
      responseType: "响应类型",
      onlineState: "浏览器在线状态",
      errorType: "错误类型",
      errorMessage: "错误信息",
      pending: "诊断中...",
      failed: "请求失败",
      readableHeaders: "可读响应头",
      bodyPreview: "响应体预览（前 2000 字符）",
      errorDetail: "错误详情",
      info: "说明",
      errorHint: "跨域策略、DNS 失败、证书错误或网络拦截都可能导致浏览器 fetch 直接失败。",
      headerFallback: "(无可读响应头，可能是 CORS 限制)",
      empty: "(空)",
      unavailable: "(不可用)",
      bodyReadFail: "读取响应体失败"
    }
  };

  let currentLang = "en";

  function t(key) {
    return (i18n[currentLang] && i18n[currentLang][key]) || i18n.en[key] || key;
  }

  const targets = [
    { name: "www.qianjunakasumi.moe", url: "https://www.qianjunakasumi.moe/" },
    { name: "id.qianjunakasumi.moe", url: "https://id.qianjunakasumi.moe/" }
  ];

  function cardForTarget(name) {
    const card = document.createElement("article");
    card.className = "card";
    const heading = document.createElement("h2");
    heading.textContent = name;
    const meta = document.createElement("div");
    meta.className = "meta";
    card.append(heading, meta);
    return card;
  }

  function setMeta(card, entries) {
    const meta = card.querySelector(".meta");
    meta.innerHTML = "";
    for (const [key, value, className] of entries) {
      const keyNode = document.createElement("div");
      keyNode.className = "key";
      keyNode.textContent = key;
      const valueNode = document.createElement("div");
      valueNode.textContent = value;
      if (className) {
        valueNode.classList.add(className);
      }
      meta.append(keyNode, valueNode);
    }
  }

  function appendBlock(card, title, content) {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = title;
    const pre = document.createElement("pre");
    pre.textContent = content || t("empty");
    details.append(summary, pre);
    card.appendChild(details);
  }

  function formatHeaders(headers) {
    const list = [];
    headers.forEach((value, key) => {
      list.push(`${key}: ${value}`);
    });
    return list.length ? list.join("\n") : t("headerFallback");
  }

  function applyLanguage() {
    document.documentElement.lang = currentLang;
    document.title = `${t("title")} - qianjunakasumi.moe`;
    document.getElementById("pageTitle").textContent = t("title");
    document.getElementById("pageDescription").textContent = t("description");
    document.getElementById("runButton").textContent = t("run");
    document.getElementById("statusLink").textContent = t("statusPage");
    document.getElementById("languageText").textContent = `${t("language")} `;
  }

  async function diagnose(url, card) {
    const startedAt = performance.now();
    const diagnostics = {
      requestUrl: url,
      userAgent: navigator.userAgent,
      online: navigator.onLine
    };

    try {
      const response = await fetch(url, {
        method: "GET",
        mode: "cors",
        cache: "no-store",
        redirect: "follow",
        credentials: "omit"
      });

      const elapsed = Math.round(performance.now() - startedAt);
      diagnostics.elapsedMs = elapsed;
      diagnostics.status = `${response.status} ${response.statusText || ""}`.trim();
      diagnostics.ok = response.ok;
      diagnostics.responseType = response.type;
      diagnostics.finalUrl = response.url;

      let bodyText = "";
      try {
        bodyText = await response.text();
      } catch (bodyError) {
        bodyText = `${t("bodyReadFail")}: ${bodyError.message}`;
      }

      setMeta(card, [
        [t("requestUrl"), diagnostics.requestUrl],
        [t("finalUrl"), diagnostics.finalUrl || t("unavailable")],
        [t("status"), diagnostics.status, diagnostics.ok ? "status-ok" : "status-fail"],
        [t("duration"), `${diagnostics.elapsedMs} ms`],
        [t("responseType"), diagnostics.responseType],
        [t("onlineState"), diagnostics.online ? "online" : "offline"]
      ]);

      appendBlock(card, t("readableHeaders"), formatHeaders(response.headers));
      appendBlock(card, t("bodyPreview"), bodyText.slice(0, 2000));
    } catch (error) {
      const elapsed = Math.round(performance.now() - startedAt);
      setMeta(card, [
        [t("requestUrl"), diagnostics.requestUrl],
        [t("status"), t("failed"), "status-fail"],
        [t("duration"), `${elapsed} ms`],
        [t("onlineState"), diagnostics.online ? "online" : "offline"],
        [t("errorType"), error && error.name ? error.name : "UnknownError"],
        [t("errorMessage"), error && error.message ? error.message : String(error)]
      ]);

      appendBlock(card, t("errorDetail"), JSON.stringify({
        name: error && error.name,
        message: error && error.message,
        stack: error && error.stack
      }, null, 2));
      appendBlock(card, t("info"), t("errorHint"));
    }
  }

  async function runDiagnosis() {
    const runButton = document.getElementById("runButton");
    const results = document.getElementById("results");
    runButton.disabled = true;
    results.innerHTML = "";

    for (const target of targets) {
      const card = cardForTarget(target.name);
      setMeta(card, [[t("status"), t("pending")]]);
      results.appendChild(card);
      await diagnose(target.url, card);
    }

    runButton.disabled = false;
  }

  document.getElementById("languageSelect").addEventListener("change", (event) => {
    currentLang = event.target.value;
    applyLanguage();
    runDiagnosis();
  });
  document.getElementById("runButton").addEventListener("click", runDiagnosis);
  applyLanguage();
  runDiagnosis();
</script>
</body>
</html>
